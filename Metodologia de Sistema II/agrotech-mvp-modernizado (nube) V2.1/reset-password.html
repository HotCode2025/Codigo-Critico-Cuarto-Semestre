<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#047857" />
  <title>AgroTech — Nueva contraseña</title>
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    .mobile-container { padding: 0; position: relative; }

    .login-bg {
      position: absolute; inset: 0;
      background: url('img/login-bg.jpg') center 60% / cover no-repeat;
    }
    .login-bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(6,20,12,0.45) 0%, rgba(6,20,12,0.1) 28%, rgba(6,20,12,0.35) 60%, rgba(6,20,12,0.85) 100%);
    }

    .login-content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
    }

    .login-brand {
      flex-shrink: 0;
      padding: 20px 24px 0;
      font-weight: 700; font-size: 1.05rem; color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-tagline {
      flex-shrink: 0;
      padding: 18px 24px 0;
    }
    .login-tagline h1 {
      color: #fff; font-size: 1.4rem; font-weight: 800; line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      margin: 0 0 6px;
    }
    .login-tagline-accent {
      width: 46px; height: 4px; border-radius: var(--radius-full);
      background: var(--warning-500); margin-bottom: 8px;
    }
    .login-tagline p {
      color: rgba(255,255,255,0.88); font-size: 0.8rem; margin: 0;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-card-area {
      flex: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      min-height: 0;
      padding: 16px 20px 20px;
    }

    .login-glass-card {
      flex-shrink: 1;
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px 20px 22px;
      box-shadow: var(--shadow-xl);
    }

    .login-error { display: none; background: rgba(239,68,68,0.12); color: var(--danger-600); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; font-weight: 600; }
    .login-success { display: none; background: rgba(34,197,94,0.12); color: var(--success-500); border: 1px solid rgba(34,197,94,0.25); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; font-weight: 600; }

    .login-back-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-700);
      text-decoration: none;
      margin-top: 16px;
    }
    .login-back-link:hover { text-decoration: underline; }

    .reset-desc { font-size: 0.82rem; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="login-bg"></div>
  <div class="login-bg-overlay"></div>

  <div class="login-content">
    <div class="login-brand">AgroTech</div>

    <div class="login-tagline">
      <h1>Elegí tu nueva<br>contraseña</h1>
      <div class="login-tagline-accent"></div>
      <p>Últimos pasos para volver a entrar</p>
    </div>

    <div class="login-card-area">
      <div class="login-glass-card">
        <p class="reset-desc" id="reset-desc">Ingresá tu nueva contraseña (mínimo 6 caracteres).</p>

        <div class="login-error" id="reset-error"></div>
        <div class="login-success" id="reset-success"></div>

        <form id="form-reset">
          <div class="form-group">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" class="form-input" id="reset-password" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-input" id="reset-password-confirm" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="reset-submit">Guardar nueva contraseña</button>
        </form>

        <a href="login.html" class="login-back-link">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</div>

<script src="api.js?v=3"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const form = document.getElementById('form-reset');
  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');

  if (!token) {
    document.getElementById('reset-desc').textContent = 'Este link no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?" en el login.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const password = document.getElementById('reset-password').value;
    const confirm = document.getElementById('reset-password-confirm').value;

    if (password !== confirm) {
      errorEl.textContent = 'Las contraseñas no coinciden.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('reset-submit');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
      const { message } = await AgroAPI.resetPassword(token, password);
      successEl.textContent = message + ' Redirigiendo al login...';
      successEl.style.display = 'block';
      form.style.display = 'none';
      setTimeout(() => { location.href = 'login.html'; }, 2000);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Guardar nueva contraseña';
    }
  });

  if (AgroAPI.getToken()) location.href = 'index.html';
</script>

</body>
</html>
