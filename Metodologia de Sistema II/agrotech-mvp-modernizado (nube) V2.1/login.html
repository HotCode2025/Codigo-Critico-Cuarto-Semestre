<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#047857" />
  <title>AgroTech — Ingresar</title>
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    .mobile-container { padding: 0; position: relative; }

    .login-bg {
      position: absolute; inset: 0;
      background: url('img/login-bg.jpg') center 60% / cover no-repeat;
    }
    .login-bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(6,20,12,0.45) 0%, rgba(6,20,12,0.1) 28%, rgba(6,20,12,0.35) 60%, rgba(6,20,12,0.85) 100%);
    }

    .login-content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
    }

    .login-brand {
      flex-shrink: 0;
      padding: 20px 24px 0;
      font-weight: 700; font-size: 1.05rem; color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-tagline {
      flex-shrink: 0;
      padding: 18px 24px 0;
    }
    .login-tagline h1 {
      color: #fff; font-size: 1.4rem; font-weight: 800; line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      margin: 0 0 6px;
    }
    .login-tagline-accent {
      width: 46px; height: 4px; border-radius: var(--radius-full);
      background: var(--warning-500); margin-bottom: 8px;
    }
    .login-tagline p {
      color: rgba(255,255,255,0.88); font-size: 0.8rem; margin: 0;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-card-area {
      flex: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      min-height: 0;
      padding: 16px 20px 20px;
    }

    .login-glass-card {
      flex-shrink: 1;
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px 20px 22px;
      box-shadow: var(--shadow-xl);
    }

    .login-tabs {
      display: flex; gap: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.3);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      margin-bottom: 20px;
    }
    .login-tabs .tab-pill {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .login-tabs .tab-pill:hover { color: var(--text-primary); }
    .login-tabs .tab-pill.active {
      background: rgba(255,255,255,0.92);
      color: var(--primary-700);
      box-shadow: var(--shadow-sm);
    }

    .login-error { display: none; background: rgba(239,68,68,0.12); color: var(--danger-600); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; font-weight: 600; }

    .login-forgot-link {
      display: block;
      text-align: right;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary-700);
      text-decoration: none;
      margin: -10px 0 18px;
    }
    .login-forgot-link:hover { text-decoration: underline; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="login-bg"></div>
  <div class="login-bg-overlay"></div>

  <div class="login-content">
    <div class="login-brand">AgroTech</div>

    <div class="login-tagline">
      <h1>Gestión financiera<br>para el agro</h1>
      <div class="login-tagline-accent"></div>
      <p>Finanzas de finca + Red de Productores</p>
    </div>

    <div class="login-card-area">
      <div class="login-glass-card">
        <div class="login-tabs">
          <button class="tab-pill active" onclick="switchTab(0)">Iniciar sesión</button>
          <button class="tab-pill" onclick="switchTab(1)">Crear cuenta</button>
        </div>

        <div class="login-error" id="login-error"></div>

        <div class="panel active" id="panel-0">
          <form id="form-login">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="login-email" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-input" id="login-password" required>
            </div>
            <a href="forgot-password.html" class="login-forgot-link">¿Olvidaste tu contraseña?</a>
            <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
          </form>
        </div>

        <div class="panel" id="panel-1">
          <form id="form-register">
            <div class="form-group">
              <label class="form-label">Nombre y apellido</label>
              <input type="text" class="form-input" id="reg-nombre" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="reg-email" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-input" id="reg-password" minlength="6" required>
            </div>
            <div class="form-group">
              <label class="form-label">Zona (Red de Productores)</label>
              <select class="form-select" id="reg-zona">
                <optgroup label="San Rafael">
                  <option>San Rafael — Norte</option>
                  <option>San Rafael — Sur</option>
                  <option>San Rafael — Este</option>
                  <option>San Rafael — Oeste</option>
                  <option>General Alvear</option>
                </optgroup>
                <optgroup label="Valle de Uco">
                  <option>Tunuyán</option>
                  <option>Tupungato</option>
                  <option>San Carlos</option>
                  <option>La Consulta</option>
                  <option>Vista Flores</option>
                  <option>Los Chacayes</option>
                  <option>El Cepillo</option>
                </optgroup>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  function switchTab(n) {
    document.querySelectorAll('.login-tabs .tab-pill').forEach((t, i) => t.classList.toggle('active', i === n));
    document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === n));
    document.getElementById('login-error').style.display = 'none';
  }

  function mostrarError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    try {
      const { token, productor } = await AgroAPI.login({
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value
      });
      AgroAPI.setSesion(token, productor);
      location.href = 'index.html';
    } catch (err) {
      mostrarError(err.message);
    }
  });

  document.getElementById('form-register').addEventListener('submit', async function (e) {
    e.preventDefault();
    try {
      const { token, productor } = await AgroAPI.register({
        nombre: document.getElementById('reg-nombre').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        zona: document.getElementById('reg-zona').value
      });
      AgroAPI.setSesion(token, productor);
      location.href = 'index.html';
    } catch (err) {
      mostrarError(err.message);
    }
  });

  if (AgroAPI.getToken()) location.href = 'index.html';
</script>

</body>
</html>
