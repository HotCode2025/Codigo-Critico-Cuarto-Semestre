<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#047857" />
  <title>AgroTech — Ingresar</title>
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    .mobile-container { padding: 0; }

    .login-hero {
      position: relative;
      flex-shrink: 0;
      height: 40vh;
      min-height: 230px;
      max-height: 320px;
      background: url('img/login-bg.jpg') center 65% / cover no-repeat;
    }
    .login-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(6,20,12,0.55) 0%, rgba(6,20,12,0.15) 45%, rgba(6,20,12,0.9) 100%);
    }
    .login-hero-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px 24px 22px;
    }
    .login-hero-brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 1.05rem; color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .login-hero-text h1 {
      color: #fff; font-size: 1.5rem; font-weight: 800; line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      margin: 0 0 6px;
    }
    .login-hero-accent {
      width: 46px; height: 4px; border-radius: var(--radius-full);
      background: var(--warning-500); margin-bottom: 10px;
    }
    .login-hero-sub {
      color: rgba(255,255,255,0.88); font-size: 0.8rem; margin: 0;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-sheet {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-body);
      border-radius: 24px 24px 0 0;
      margin-top: -20px;
      position: relative;
      z-index: 2;
      padding: 24px 24px 28px;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.08);
    }

    .login-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .login-error { display: none; background: rgba(239,68,68,0.1); color: var(--danger-500); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

<div class="mobile-container flex flex-col">

  <div class="login-hero">
    <div class="login-hero-overlay"></div>
    <div class="login-hero-content">
      <div class="login-hero-brand">🌾 AgroTech</div>
      <div class="login-hero-text">
        <h1>Gestión financiera<br>para el agro</h1>
        <div class="login-hero-accent"></div>
        <p class="login-hero-sub">Finanzas de finca + Red de Productores</p>
      </div>
    </div>
  </div>

  <div class="login-sheet">
    <div class="login-tabs">
      <button class="tab-pill active" onclick="switchTab(0)">Iniciar sesión</button>
      <button class="tab-pill" onclick="switchTab(1)">Crear cuenta</button>
    </div>

    <div class="login-error" id="login-error"></div>

    <div class="panel active" id="panel-0">
      <form id="form-login">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="login-email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" id="login-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
      </form>
    </div>

    <div class="panel" id="panel-1">
      <form id="form-register">
        <div class="form-group">
          <label class="form-label">Nombre y apellido</label>
          <input type="text" class="form-input" id="reg-nombre" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="reg-email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" id="reg-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label">Zona (Red de Productores)</label>
          <select class="form-select" id="reg-zona">
            <optgroup label="San Rafael">
              <option>San Rafael — Norte</option>
              <option>San Rafael — Sur</option>
              <option>San Rafael — Este</option>
              <option>San Rafael — Oeste</option>
              <option>General Alvear</option>
            </optgroup>
            <optgroup label="Valle de Uco">
              <option>Tunuyán</option>
              <option>Tupungato</option>
              <option>San Carlos</option>
              <option>La Consulta</option>
              <option>Vista Flores</option>
              <option>Los Chacayes</option>
              <option>El Cepillo</option>
            </optgroup>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
      </form>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  function switchTab(n) {
    document.querySelectorAll('.login-tabs .tab-pill').forEach((t, i) => t.classList.toggle('active', i === n));
    document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === n));
    document.getElementById('login-error').style.display = 'none';
  }

  function mostrarError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    try {
      const { token, productor } = await AgroAPI.login({
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value
      });
      AgroAPI.setSesion(token, productor);
      location.href = 'index.html';
    } catch (err) {
      mostrarError(err.message);
    }
  });

  document.getElementById('form-register').addEventListener('submit', async function (e) {
    e.preventDefault();
    try {
      const { token, productor } = await AgroAPI.register({
        nombre: document.getElementById('reg-nombre').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        zona: document.getElementById('reg-zona').value
      });
      AgroAPI.setSesion(token, productor);
      location.href = 'index.html';
    } catch (err) {
      mostrarError(err.message);
    }
  });

  if (AgroAPI.getToken()) location.href = 'index.html';
</script>

</body>
</html>
