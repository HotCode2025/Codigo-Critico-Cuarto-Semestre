<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f2937">
  <title>AgroTech — Cargar Ingreso</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<div class="mobile-container flex flex-col">
  <header class="app-header" style="background:linear-gradient(135deg, #1f2937 0%, #111827 100%);padding-bottom:24px;">
    <div class="header-content">
      <div class="header-top">
        <a href="index.html" class="header-badge" style="text-decoration:none;">←</a>
        <div style="text-align:right;">
          <div class="header-subtitle">Registro de Movimientos</div>
          <h1 class="header-title" style="font-size:1.25rem;">Cargar Ingreso</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="scroll-area">
    <form id="form-ingreso" class="animate-fade-in-up">
      <div class="form-group">
        <label class="form-label">Método de Pago</label>
        <select id="select-tipo-pago" class="form-select" style="border-color:var(--finance-500);background:var(--finance-50);color:var(--finance-700);">
          <option value="fisico">Cheque Físico (Ventanilla)</option>
          <option value="echeq">Echeq (Electrónico)</option>
          <option value="transferencia">Transferencia Bancaria</option>
          <option value="contado">Efectivo / Contado</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Origen de los Fondos</label>
        <select id="select-origen" class="form-select"></select>
      </div>

      <div class="form-group">
        <label class="form-label">Monto Nominal ($)</label>
        <input type="number" id="input-monto" placeholder="Ej: 1000000" class="form-input" style="font-size:1.5rem;" min="1" step="0.01" required>
      </div>

      <div class="form-group">
        <label class="checkbox-custom" id="label-descuento" style="margin-bottom:0;">
          <input type="checkbox" id="chk-hubo-descuento">
          <div>
            <p style="font-weight:700;font-size:0.85rem;">Se descontó en ALyC / Banco</p>
            <p style="font-size:0.7rem;color:var(--text-muted);">La diferencia se registrará como Costo Financiero</p>
          </div>
        </label>
      </div>

      <div class="form-group hidden" id="modulo-alyc">
        <label class="form-label" style="color:var(--warning-600);">Monto Neto Acreditado ($)</label>
        <input type="number" id="input-monto-neto" placeholder="Ej: 850000" class="form-input" style="border-color:var(--warning-400);background:var(--warning-50);" min="1" step="0.01">
        <p style="font-size:0.7rem;color:var(--warning-600);margin-top:4px;" id="txt-costo-financiero"></p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Fecha de Ingreso</label>
          <input type="date" id="input-fecha" class="form-input">
        </div>
        <div class="form-group" id="container-banco">
          <label class="form-label">Banco / Billetera</label>
          <select id="select-banco" class="form-select">
            <option>Galicia</option>
            <option>Santander</option>
            <option>Nación</option>
            <option>Macro</option>
            <option>Mercado Pago</option>
          </select>
        </div>
      </div>

      <div class="form-group hidden" id="container-fecha-cobro">
        <label class="form-label">Fecha de Cobro (Cheque)</label>
        <input type="date" id="input-fecha-cobro" class="form-input" style="border-color:var(--warning-400);background:var(--warning-50);">
        <p style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;">El sistema te avisará en el dashboard para depositarlo.</p>
      </div>

      <div class="form-group" id="container-estado">
        <label class="form-label">Estado del Documento</label>
        <div style="display:flex;gap:8px;">
          <label class="checkbox-custom" style="flex:1;" id="label-normal">
            <input type="radio" name="estado-cheque" value="normal" checked>
            <div>
              <p style="font-weight:700;font-size:0.85rem;"><span class="ico" data-icon="check-circle"></span> A cobrar</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Normal</p>
            </div>
          </label>
          <label class="checkbox-custom" style="flex:1;" id="label-rechazado">
            <input type="radio" name="estado-cheque" value="rechazado">
            <div>
              <p style="font-weight:700;font-size:0.85rem;color:var(--danger-500);"><span class="ico" data-icon="x-circle"></span> Rechazado</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Sin fondos</p>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="ico" data-icon="lock"></span> Validación de Auditoría</label>
        <div id="modulo-fisico" class="validacion-mod">
          <label class="checkbox-custom" style="background:var(--warning-50);border-color:var(--warning-300);">
            <input type="checkbox" id="chk-fisico">
            <div>
              <p style="font-weight:700;font-size:0.8rem;">Valido documento físico</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Frases de endoso aplicadas correctamente en frente y dorso.</p>
            </div>
          </label>
        </div>
        <div id="modulo-echeq" class="validacion-mod hidden">
          <label class="checkbox-custom" style="background:var(--finance-50);border-color:var(--finance-300);">
            <input type="checkbox" id="chk-echeq">
            <div>
              <p style="font-weight:700;font-size:0.8rem;">Confirmo recepción en plataforma</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Aceptación registrada en home banking.</p>
            </div>
          </label>
        </div>
        <div id="modulo-transferencia" class="validacion-mod hidden">
          <label class="checkbox-custom" style="background:var(--purple-50);border-color:#a855f7;">
            <input type="checkbox" id="chk-transf">
            <div>
              <p style="font-weight:700;font-size:0.8rem;">Valido fondos impactados</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Transferencia confirmada en cuenta destino.</p>
            </div>
          </label>
        </div>
        <div id="modulo-contado" class="validacion-mod hidden">
          <label class="checkbox-custom" style="background:var(--primary-50);border-color:var(--primary-300);">
            <input type="checkbox" id="chk-contado">
            <div>
              <p style="font-weight:700;font-size:0.8rem;">Dinero físico recontado</p>
              <p style="font-size:0.7rem;color:var(--text-muted);">Efectivo verificado y en caja.</p>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="background:linear-gradient(135deg, #1f2937 0%, #111827 100%);">
        <span class="ico" data-icon="landmark"></span> Registrar Ingreso en Flujo
      </button>
    </form>

    <div class="mt-4" id="seccion-ingresos-cargados">
      <h3 class="section-title">Ingresos cargados</h3>
      <div id="lista-ingresos-cargados"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span>Inicio</span>
    </a>
    <a href="gastos.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span>
      <span>Gastos</span>
    </a>
    <a href="ingresos.html" class="bottom-nav-item active">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></span>
      <span>Ingresos</span>
    </a>
    <a href="envios.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span>
      <span>Envíos</span>

    <a href="balance.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span>
      <span>Balance</span>
    </a>
    <a href="red.html" class="bottom-nav-item">

      <span>ONs</span>
    </a>
    <a href="n8n.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
      <span>N8N</span>
    </a>
    <a href="configuracion.html" class="bottom-nav-item">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></span>
      <span>Más</span>
    </a>

  <div class="modal-overlay" id="modal-editar-ingreso">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 style="font-size:1rem;font-weight:800;margin-bottom:16px;">Editar ingreso</h3>
      <div class="form-group">
        <label class="form-label">Cuartel</label>
        <select class="form-select" id="ei-lote"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Monto ($)</label>
        <input type="number" class="form-input" id="ei-monto" min="1" step="0.01">
        <p id="ei-aviso-descuento" style="display:none;font-size:0.7rem;color:var(--text-muted);margin-top:4px;">Este ingreso tiene descuento: para cambiar el monto, borralo y cargalo de nuevo.</p>
      </div>
      <div class="form-group" id="ei-grupo-fecha">
        <label class="form-label">Fecha de cobro (cheque)</label>
        <input type="date" class="form-input" id="ei-fecha">
      </div>
      <button class="btn btn-primary btn-full" id="ei-guardar" style="margin-top:8px;">Guardar cambios</button>
      <button class="btn btn-ghost btn-full" id="ei-cancelar" style="margin-top:8px;">Cancelar</button>
    </div>
  </div>

<script src="api.js?v=17"></script>
<script src="icons.js?v=2"></script>
<script src="shared.js?v=14"></script>
<script>
  document.addEventListener('DOMContentLoaded', async function() {
    const AT = AgroTech;
    await AT.ready;

    const selectOrigen = document.getElementById('select-origen');
    AT.getLotes().forEach(lote => {
      const opt = document.createElement('option');
      opt.value = lote.id;
      opt.textContent = lote.nombre;
      selectOrigen.appendChild(opt);
    });

    const tipoPago = document.getElementById('select-tipo-pago');
    const chkDescuento = document.getElementById('chk-hubo-descuento');
    const moduloAlyc = document.getElementById('modulo-alyc');
    const containerEstado = document.getElementById('container-estado');
    const containerFechaCobro = document.getElementById('container-fecha-cobro');
    const containerBanco = document.getElementById('container-banco');
    const modulosValidacion = document.querySelectorAll('.validacion-mod');
    const inputMonto = document.getElementById('input-monto');
    const inputMontoNeto = document.getElementById('input-monto-neto');
    const txtCostoFinanciero = document.getElementById('txt-costo-financiero');

    document.getElementById('input-fecha').valueAsDate = new Date();

    function actualizarInterfaz() {
      const tipo = tipoPago.value;
      modulosValidacion.forEach(m => m.classList.add('hidden'));
      document.getElementById('modulo-' + tipo).classList.remove('hidden');

      if (tipo === 'contado' || tipo === 'transferencia') {
        chkDescuento.checked = false;
        moduloAlyc.classList.add('hidden');
        containerEstado.classList.add('hidden');
        containerFechaCobro.classList.add('hidden');
        containerBanco.classList.toggle('hidden', tipo === 'contado');
      } else {
        containerEstado.classList.remove('hidden');
        containerBanco.classList.remove('hidden');
        if (!chkDescuento.checked) containerFechaCobro.classList.remove('hidden');
      }
    }

    tipoPago.addEventListener('change', actualizarInterfaz);

    chkDescuento.addEventListener('change', function() {
      document.getElementById('label-descuento').classList.toggle('checked', this.checked);
      if (this.checked) {
        moduloAlyc.classList.remove('hidden');
        containerEstado.classList.add('hidden');
        containerFechaCobro.classList.add('hidden');
      } else {
        moduloAlyc.classList.add('hidden');
        containerEstado.classList.remove('hidden');
        if (tipoPago.value === 'fisico' || tipoPago.value === 'echeq') {
          containerFechaCobro.classList.remove('hidden');
        }
      }
    });

    inputMontoNeto.addEventListener('input', function() {
      const nominal = parseFloat(inputMonto.value) || 0;
      const neto = parseFloat(this.value) || 0;
      if (neto > 0 && neto < nominal) {
        const costo = nominal - neto;
        const pct = ((costo / nominal) * 100).toFixed(2);
        txtCostoFinanciero.textContent = `Costo financiero: ${AT.formatMoney(costo)} (${pct}%)`;
      } else {
        txtCostoFinanciero.textContent = '';
      }
    });

    document.querySelectorAll('input[name="estado-cheque"]').forEach(r => {
      r.addEventListener('change', function() {
        document.querySelectorAll('#label-normal, #label-rechazado').forEach(l => l.classList.remove('checked'));
        this.closest('.checkbox-custom').classList.add('checked');
      });
    });
    document.querySelector('input[value="normal"]').closest('.checkbox-custom').classList.add('checked');

    actualizarInterfaz();

    // ===== Ingresos cargados: editar y borrar =====
    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }
    const NOMBRES_TIPO = { contado: 'Efectivo', transferencia: 'Transferencia', fisico: 'Cheque físico', echeq: 'Echeq' };
    const modalEditarIngreso = document.getElementById('modal-editar-ingreso');
    let ingresoEditandoId = null;

    function esCheque(i) { return i.tipo === 'fisico' || i.tipo === 'echeq'; }

    function renderIngresosCargados() {
      const cont = document.getElementById('lista-ingresos-cargados');
      const ingresos = AT.getIngresosLista().slice(0, 15);
      if (ingresos.length === 0) {
        cont.innerHTML = '<p style="font-size:0.8rem;color:var(--text-secondary);">Todavía no cargaste ingresos.</p>';
        return;
      }
      cont.innerHTML = ingresos.map(i => `
        <div class="list-item" style="margin-bottom:8px;gap:8px;">
          <div style="flex:1;min-width:0;">
            <div class="list-item-name">${NOMBRES_TIPO[i.tipo] || i.tipo}${i.estado === 'rechazado' ? ' · rechazado' : ''}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);">${escapeHtml(AT.getNombreLote(i.loteId))}${esCheque(i) && i.fechaCobro ? ' · Cobro ' + AT.formatDate(i.fechaCobro) : ''}${i.conDescuento ? ' · con descuento' : ''}</div>
          </div>
          <div class="list-item-value" style="margin-right:4px;">${AT.formatMoney(i.conDescuento ? i.montoNeto : i.monto)}</div>
          <button type="button" class="btn btn-sm btn-secondary" data-editar-ingreso="${i.id}" title="Editar"><span class="ico" data-icon="pencil"></span></button>
          <button type="button" class="btn btn-sm btn-secondary" data-borrar-ingreso="${i.id}" title="Borrar"><span class="ico" data-icon="trash"></span></button>
        </div>
      `).join('');
    }

    function abrirEditorIngreso(id) {
      const ing = AT.getIngresosLista().find(x => x.id === id);
      if (!ing) return;
      ingresoEditandoId = id;
      const select = document.getElementById('ei-lote');
      const opciones = AT.getLotes().map(l => ({ id: l.id, nombre: l.nombre }));
      if (!opciones.some(o => Number(o.id) === Number(ing.loteId))) opciones.push({ id: ing.loteId, nombre: AT.getNombreLote(ing.loteId) + ' (archivado)' });
      select.innerHTML = opciones.map(o => `<option value="${o.id}">${escapeHtml(o.nombre)}</option>`).join('');
      select.value = ing.loteId;
      const inputMontoEdit = document.getElementById('ei-monto');
      inputMontoEdit.value = ing.monto;
      inputMontoEdit.disabled = ing.conDescuento;
      document.getElementById('ei-aviso-descuento').style.display = ing.conDescuento ? 'block' : 'none';
      document.getElementById('ei-grupo-fecha').style.display = esCheque(ing) ? '' : 'none';
      document.getElementById('ei-fecha').value = ing.fechaCobro ? String(ing.fechaCobro).slice(0, 10) : '';
      modalEditarIngreso.classList.add('active');
    }

    document.getElementById('lista-ingresos-cargados').addEventListener('click', (e) => {
      const editar = e.target.closest('[data-editar-ingreso]');
      if (editar) { abrirEditorIngreso(Number(editar.dataset.editarIngreso)); return; }
      const borrar = e.target.closest('[data-borrar-ingreso]');
      if (borrar) {
        const id = Number(borrar.dataset.borrarIngreso);
        AT.confirmDialog('Se borra este ingreso (y su cheque de la cartera, si tiene) y deja de contar en tu balance. No se puede deshacer.', async () => {
          try {
            await AT.eliminarIngreso(id);
            AT.toast('Ingreso borrado');
            renderIngresosCargados();
          } catch (err) {
            AT.toast('No se pudo borrar: ' + err.message, 'error');
          }
        });
      }
    });

    document.getElementById('ei-cancelar').addEventListener('click', () => modalEditarIngreso.classList.remove('active'));
    document.getElementById('ei-guardar').addEventListener('click', async () => {
      const monto = parseFloat(document.getElementById('ei-monto').value) || 0;
      if (monto <= 0) { AT.toast('Ingresá un monto válido', 'error'); return; }
      const datos = { loteId: Number(document.getElementById('ei-lote').value), monto };
      const fecha = document.getElementById('ei-fecha').value;
      if (fecha) datos.fechaCobro = fecha;
      try {
        await AT.editarIngreso(ingresoEditandoId, datos);
        modalEditarIngreso.classList.remove('active');
        AT.toast('Ingreso actualizado');
        renderIngresosCargados();
      } catch (err) {
        AT.toast('No se pudo guardar: ' + err.message, 'error');
      }
    });

    renderIngresosCargados();

    document.getElementById('form-ingreso').addEventListener('submit', async function(e) {
      e.preventDefault();

      const tipo = tipoPago.value;
      let isValid = false;

      if (tipo === 'fisico') isValid = document.getElementById('chk-fisico').checked;
      if (tipo === 'echeq') isValid = document.getElementById('chk-echeq').checked;
      if (tipo === 'transferencia') isValid = document.getElementById('chk-transf').checked;
      if (tipo === 'contado') isValid = document.getElementById('chk-contado').checked;

      if (!isValid) {
        AT.toast('Debe confirmar la validación de auditoría', 'error');
        return;
      }

      const montoNominal = parseFloat(inputMonto.value) || 0;
      const origen = document.getElementById('select-origen').value;
      const estado = document.querySelector('input[name="estado-cheque"]:checked').value;

      if (montoNominal <= 0) { AT.toast('Ingresá un monto válido', 'error'); return; }

      let montoNeto = 0;
      if (chkDescuento.checked) {
        montoNeto = parseFloat(inputMontoNeto.value) || 0;
        if (montoNeto <= 0 || montoNeto >= montoNominal) {
          AT.toast('El monto neto debe ser menor al nominal', 'error'); return;
        }
      }

      let fechaCobro = null;
      if ((tipo === 'fisico' || tipo === 'echeq') && estado === 'normal' && !chkDescuento.checked) {
        fechaCobro = document.getElementById('input-fecha-cobro').value;
        if (!fechaCobro) { AT.toast('Ingresá la fecha de cobro del cheque', 'error'); return; }
      }

      try {
        await AT.addIngreso(origen, montoNominal, tipo, estado, chkDescuento.checked, montoNeto, fechaCobro);
        AT.toast('Ingreso registrado correctamente');
        setTimeout(() => window.location.href = 'index.html', 600);
      } catch (err) {
        AT.toast('No se pudo registrar el ingreso: ' + err.message, 'error');
      }
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
            if (!refreshing) { refreshing = true; window.location.reload(); }
          }
        });
      });
    }).catch(err => console.log('❌ SW error:', err));
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  }
</script>
</body>
</html>
