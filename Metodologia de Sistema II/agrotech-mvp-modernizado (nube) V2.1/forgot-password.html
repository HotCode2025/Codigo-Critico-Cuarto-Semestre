<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#047857" />
  <title>AgroTech — Recuperar contraseña</title>
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    .mobile-container { padding: 0; position: relative; }

    .login-bg {
      position: absolute; inset: 0;
      background: url('img/login-bg.jpg') center 60% / cover no-repeat;
    }
    .login-bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(6,20,12,0.45) 0%, rgba(6,20,12,0.1) 28%, rgba(6,20,12,0.35) 60%, rgba(6,20,12,0.85) 100%);
    }

    .login-content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
    }

    .login-brand {
      flex-shrink: 0;
      padding: 20px 24px 0;
      font-weight: 700; font-size: 1.05rem; color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-tagline {
      flex-shrink: 0;
      padding: 18px 24px 0;
    }
    .login-tagline h1 {
      color: #fff; font-size: 1.4rem; font-weight: 800; line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      margin: 0 0 6px;
    }
    .login-tagline-accent {
      width: 46px; height: 4px; border-radius: var(--radius-full);
      background: var(--warning-500); margin-bottom: 8px;
    }
    .login-tagline p {
      color: rgba(255,255,255,0.88); font-size: 0.8rem; margin: 0;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .login-card-area {
      flex: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      min-height: 0;
      padding: 16px 20px 20px;
    }

    .login-glass-card {
      flex-shrink: 1;
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px 20px 22px;
      box-shadow: var(--shadow-xl);
    }

    .login-error { display: none; background: rgba(239,68,68,0.12); color: var(--danger-600); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; font-weight: 600; }
    .login-success { display: none; background: rgba(34,197,94,0.12); color: var(--success-500); border: 1px solid rgba(34,197,94,0.25); border-radius: var(--radius-md); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px; font-weight: 600; }

    .login-back-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-700);
      text-decoration: none;
      margin-top: 16px;
    }
    .login-back-link:hover { text-decoration: underline; }

    .forgot-desc { font-size: 0.82rem; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="login-bg"></div>
  <div class="login-bg-overlay"></div>

  <div class="login-content">
    <div class="login-brand">AgroTech</div>

    <div class="login-tagline">
      <h1>Recuperar<br>contraseña</h1>
      <div class="login-tagline-accent"></div>
      <p>Te mandamos un link para elegir una nueva</p>
    </div>

    <div class="login-card-area">
      <div class="login-glass-card">
        <p class="forgot-desc">Ingresá el email con el que te registraste. Si la cuenta existe, vas a recibir un correo con un link para restablecer tu contraseña.</p>

        <div class="login-error" id="forgot-error"></div>
        <div class="login-success" id="forgot-success"></div>

        <form id="form-forgot">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="forgot-email" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="forgot-submit">Enviar link de recuperación</button>
        </form>

        <a href="login.html" class="login-back-link">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</div>

<script src="api.js?v=4"></script>
<script>
  document.getElementById('form-forgot').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorEl = document.getElementById('forgot-error');
    const successEl = document.getElementById('forgot-success');
    const btn = document.getElementById('forgot-submit');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const email = document.getElementById('forgot-email').value.trim();
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      const { message } = await AgroAPI.forgotPassword(email);
      successEl.textContent = message;
      successEl.style.display = 'block';
      document.getElementById('form-forgot').reset();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar link de recuperación';
    }
  });

  if (AgroAPI.getToken()) location.href = 'index.html';
</script>

</body>
</html>
