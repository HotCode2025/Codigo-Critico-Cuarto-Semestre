# Sirve el frontend estático en docker-compose. Solo publica los archivos de la app:
# nada del backend, de las herramientas ni archivos ocultos.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(server|scripts|docker|node_modules)/ { deny all; }
  location ~ /\. { deny all; }
  location ~ \.(pdf|docx|sh|md)$ { deny all; }
  location ~ ^/(package(-lock)?\.json|eslint\.config\.js|docker-compose\.yml)$ { deny all; }

  # El service worker y el HTML no se cachean, para ver los cambios al recargar.
  location ~ (\.html|sw\.js)$ { add_header Cache-Control "no-cache"; }
}
