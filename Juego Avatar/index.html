<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>La leyenda de AANG: EL AVATAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #1e2227; --gold: #e1b12c; --win: #2ecc71; --lose: #e74c3c; }
        body { font-family: 'Garamond', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle, #eaddcf 0%, #a18b70 100%); color: #f5f6fa; overflow: hidden; }
        #game-container { width: 95%; max-width: 1150px; min-height: 760px; height: auto; background-color: var(--bg-dark); border: 4px solid #574b3e; border-radius: 15px; position: relative; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 2px solid rgba(225, 177, 44, 0.2); }
        .title-area { text-align: center; animation: fadeIn 1.5s ease-out; }
        h1 { margin: 0; font-size: 2.5rem; color: var(--gold); letter-spacing: 5px; text-shadow: 2px 2px 10px black; background-color: rgba(30, 34, 39, 0.8); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--gold); }
        #main-subtitle { font-family: 'Cinzel', serif; color: #dcdde1; font-size: 0.9rem; letter-spacing: 3px; margin: 0; }
        .btn-ui { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: 'Cinzel', serif; transition: 0.3s; }
        .btn-ui:hover { background: var(--gold); color: #1e2227; }
        .card-bg { background-size: 100% 100%; background-position: center; background-repeat: no-repeat; }
        .bg-aang { background-image: url("imagenes/aan.png"); }
        .bg-katara { background-image: url("imagenes/katara.png"); }
        .bg-toph { background-image: url("imagenes/toph.png"); }
        .bg-zuko { background-image: url("imagenes/zuko.png"); }
        #battle-stage { display: none; flex: 1; padding: 20px 50px; justify-content: space-between; align-items: center; }
        .card { width: 250px; height: 365px; border-radius: 15px; border: 3px solid #555; }
        #action-footer { padding: 20px; display: none; flex-direction: column; align-items: center; gap: 10px; border-top: 1px solid #444; }
        .action-btns { display: flex; gap: 40px; }
        .action-card { width: 150px; height: 150px; background: #2f3640; border: 2px solid #574b3e; color: white; cursor: pointer; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.2rem; }
        .action-card span { font-size: 3.5rem; margin-bottom: 5px; }
        .action-card:hover { border-color: var(--gold); background: #3d4653; }
        #center-panel { width: 400px; height: 365px; background: rgba(0,0,0,0.3); border-radius: 10px; display: flex; flex-direction: column; }
        .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #2f3640; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid var(--gold); width: 350px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- MODAL DE REGLAS RESTAURADO -->
        <div id="modal-reglas" class="modal">
            <div class="modal-content">
                <h2 style="color:var(--gold)">REGLAS DEL JUEGO</h2>
                <ul style="text-align: left; margin: 20px 0; list-style: none; padding: 0;">
                    <li>👊 <strong>Puño</strong> vence a 🦵 <strong>Barrida</strong></li>
                    <li>🦶 <strong>Patada</strong> vence a 👊 <strong>Puño</strong></li>
                    <li>🦵 <strong>Barrida</strong> vence a 🦶 <strong>Patada</strong></li>
                </ul>
                <p style="border-top: 1px solid #444; padding-top:15px;">Cada maestro comienza con <strong>3 vidas</strong>. ¡El primero en reducir las vidas del oponente a 0 gana!</p>
                <button class="btn-ui" onclick="document.getElementById('modal-reglas').style.display='none'">Cerrar</button>
            </div>
        </div>

        <div id="selection-screen" style="position: absolute; inset: 0; z-index: 50; background: #1e2227; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="title-area" style="margin-bottom: 30px;">
                <h2 id="main-subtitle">LA LEYENDA DE AANG:</h2>
                <h1>AVATAR</h1>
            </div>
            <h2 style="color: var(--gold); margin-bottom: 20px;">SELECCIONA TU MAESTRO</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                <div class="card-bg bg-aang" style="width:215px; height:315px; cursor:pointer;" onclick="seleccionarPersonaje('Aang', 'bg-aang')"></div>
                <div class="card-bg bg-katara" style="width:215px; height:315px; cursor:pointer;" onclick="seleccionarPersonaje('Katara', 'bg-katara')"></div>
                <div class="card-bg bg-zuko" style="width:215px; height:315px; cursor:pointer;" onclick="seleccionarPersonaje('Zuko', 'bg-zuko')"></div>
                <div class="card-bg bg-toph" style="width:215px; height:315px; cursor:pointer;" onclick="seleccionarPersonaje('Toph', 'bg-toph')"></div>
            </div>
        </div>

        <header>
            <button class="btn-ui" onclick="document.getElementById('modal-reglas').style.display='flex'">Reglas</button>
            <div class="title-area">
                <h2 id="main-subtitle">LA LEYENDA DE AANG:</h2>
                <h1>AVATAR</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-ui" onclick="toggleMusica()">🎵</button>
                <button class="btn-ui" id="btn-reiniciar" onclick="location.reload()" style="visibility: hidden;">Reiniciar</button>
            </div>
        </header>

        <div id="battle-stage">
            <div class="character-zone">
                <div class="card card-bg" id="player-card"></div>
                <div id="vidas-jugador" style="display:flex; gap:10px; margin-top:10px;"></div>
            </div>
            <div id="center-panel">
                <div style="padding:15px; text-align:center; color:var(--gold); font-weight:bold; border-bottom:1px solid #444;">HISTORIAL</div>
                <div id="battle-history" style="flex:1; padding:15px; overflow-y:auto; font-size:1.1rem;"></div>
            </div>
            <div class="character-zone">
                <div class="card card-bg" id="enemy-card"></div>
                <div id="vidas-enemigo" style="display:flex; gap:10px; margin-top:10px;"></div>
            </div>
        </div>

        <footer id="action-footer">
            <div class="action-btns">
                <button class="action-card" onclick="atacar('Puño')"><span>👊</span>PUÑO</button>
                <button class="action-card" onclick="atacar('Patada')"><span>🦶</span>PATADA</button>
                <button class="action-card" onclick="atacar('Barrida')"><span>🦵</span>BARRIDA</button>
            </div>
        </footer>
    </div>

    <audio id="musica-fondo" loop>
        <source src="audio/batalla_oriental.mp3" type="audio/mpeg">
    </audio>

<!-- SCRIPT AL FINAL SEGÚN BUENAS PRÁCTICAS -->
    <script src="js/avatar.js"></script>
</body>
</html>
