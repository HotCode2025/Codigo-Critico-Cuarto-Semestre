# Actualizaciones automáticas de dependencias: GitHub abre un PR cuando hay versiones nuevas
# o vulnerabilidades. Solo se miran el backend de AgroTech y las acciones del CI, no el resto
# de las carpetas del repo (que son trabajos de otras materias).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/Metodologia de Sistema II/agrotech-mvp-modernizado (nube) V2.1/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Mendoza"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(server)"
    groups:
      # Las actualizaciones menores y de parche llegan en un solo PR; las mayores van aparte.
      dependencias-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
