name: 'AgroTech: reportar un error'
description: Algo de AgroTech no funciona como debería.
title: '[AgroTech] '
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Cuanto más concreto, más rápido se arregla.
        **No pegues contraseñas, tokens ni datos reales de productores.**
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Lo que viste, con el mensaje de error si apareció.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar a Gastos
        2. Cargar un gasto programado sin fecha
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde pasó?
      options:
        - Producción (Render)
        - Local con docker-compose
        - Local sin Docker
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte de la app
      multiple: true
      options:
        - Login y cuenta
        - Gastos
        - Ingresos y cheques
        - Balance y resumen
        - Inversiones
        - Red de Productores
        - Avisos (N8N, WhatsApp, email)
        - IA (facturas o plagas)
        - Otra
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: Celular Android, Chrome
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o logs
      description: Podés arrastrar imágenes acá.
